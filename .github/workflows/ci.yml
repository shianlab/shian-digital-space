name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run lint:app
      - run: npm test
      - run: npm run build
      - name: Check release assets
        run: node scripts/check-release-assets.mjs
        env:
          SHIAN_INSPECTION_DIR: .cache/release-check
